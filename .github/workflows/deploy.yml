name: Deploy React SPA to GitHub Pages

# 設定觸發條件：當推送到 main 分支時執行
on:
  push:
    branches: ["main"]
  # 允許手動從 GitHub 介面觸發部署
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限，這是部署到 Pages 必須的
permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 確保同一時間只有一個部署在執行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. 建置專案 (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build project
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FLIGHT_PROXY_URL: ${{ vars.VITE_FLIGHT_PROXY_URL }}
          VITE_AVIATIONSTACK_API_KEY: ${{ secrets.VITE_AVIATIONSTACK_API_KEY }}
          VITE_AIRLABS_API_KEY: ${{ secrets.VITE_AIRLABS_API_KEY }}
          VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      # 將打包好的 dist 資料夾上傳為 artifact，供部署 job 使用
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  # 2. 部署到 GitHub Pages (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 3. 部署 Cloudflare Worker (Deploy Worker，需配置 API Token 與 KV ID)
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Cloudflare deployment prerequisites
        id: check-config
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_ID: ${{ vars.SHARED_TRIPS_KV_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$KV_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected. Proceeding with Worker deployment."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Cloudflare API Token (Secret) 或 SHARED_TRIPS_KV_ID (Variable) 未設定，跳過 Worker 自動發布。"
          fi

      - name: Inject KV ID from GitHub Vars
        if: steps.check-config.outputs.configured == 'true'
        shell: bash
        run: |
          # 將 wrangler.toml 中的 __KV_ID__ 替換為 GitHub Variables 中的值
          # 本機路徑為 cloudflare-worker/wrangler.toml
          sed -i "s/__KV_ID__/${{ vars.SHARED_TRIPS_KV_ID }}/g" cloudflare-worker/wrangler.toml

      - name: Validate Cloudflare Worker (Dry Run)
        if: steps.check-config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'cloudflare-worker'
          command: deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: steps.check-config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'cloudflare-worker'